[package]
name = "MeleeEloTierList"
version = "0.1.0"
edition = "2024"

[dependencies]
peppi = "2.0"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tower-http = { version = "0.6", features = ["fs"] }
regex = "1.11.1"
walkdir = "2.5.0"
anyhow = "1.0.98"
bincode = "2.0.1"
futures = "0.3.31"
rayon = "1.10.0"
thiserror = "2.0.12"
fs2 = "0.4.3"
num_enum = "0.7.4"
utoipa = "5.4.0"
utoipa-swagger-ui = { version = "9.0", features = ["axum"] }
